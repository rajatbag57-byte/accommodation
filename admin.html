<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTHI AHOB | Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh
        }
        
        .admin-wrap {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px
        }
        
        .panel {
            background: #fff;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(11, 79, 163, .1);
            margin-bottom: 20px
        }
        
        .admin-form {
            max-width: 430px;
            margin: 50px auto
        }
        
        .admin-form input,
        .filters input,
        .filters select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdd9f5;
            border-radius: 7px;
            margin: 7px 0 14px
        }
        
        .btn {
            background: var(--primary-blue);
            color: #fff;
            border: 0;
            border-radius: 7px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold
        }
        
        .btn.secondary {
            background: #fff;
            color: var(--primary-blue);
            border: 1px solid var(--primary-blue)
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px
        }
        
        .stat {
            padding: 20px;
            border: 1px solid #d6e8fb;
            border-radius: 10px
        }
        
        .stat strong {
            font-size: 28px;
            color: var(--primary-blue);
            display: block
        }
        
        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto auto;
            gap: 10px;
            align-items: end
        }
        
        .table-wrap {
            overflow: auto
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px
        }
        
        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e1edf8;
            text-align: left
        }
        
        th {
            color: var(--primary-blue)
        }
        
        .hidden {
            display: none
        }
        
        .status {
            font-weight: bold;
            color: var(--primary-blue)
        }
        
        .danger {
            color: #b00020
        }
        
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px
        }
        
        @media(max-width:800px) {
            .stats {
                grid-template-columns: 1fr 1fr
            }
            .filters {
                grid-template-columns: 1fr
            }
            .top {
                align-items: flex-start
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <h2>ASTHI AHOB</h2><small>ADMIN DASHBOARD</small></a><a href="index.html" class="admin-link">Public Site</a></nav>
    </header>
    <main class="admin-wrap">
        <section id="loginPanel" class="panel admin-form">
            <h2>Admin Login</h2>
            <p>Authorized administrators only.</p>
            <form id="loginForm"><label>Username</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" type="submit">Login</button>
                <p id="loginError" class="error"></p>
            </form>
        </section>

        <section id="dashboard" class="hidden">
            <div class="panel top">
                <div>
                    <h1>Accommodation Dashboard</h1>
                    <p>ASTHI AHOB UTSAV</p>
                </div><button class="btn secondary" id="logoutBtn">Logout</button></div>
            <div class="stats panel">
                <div class="stat">Registrations<strong id="total">0</strong></div>
                <div class="stat">Guests<strong id="guests">0</strong></div>
                <div class="stat">Confirmed<strong id="confirmed">0</strong></div>
                <div class="stat">Pending<strong id="pending">0</strong></div>
            </div>
            <div class="panel">
                <div class="filters">
                    <div><label>Search</label><input id="search" placeholder="Family code / phone / name"></div>
                    <div><label>Status</label><select id="status"><option value="">All</option><option>Pending</option><option>Confirmed</option><option>Cancelled</option></select></div>
                    <div><label>Date</label><input id="date" type="date"></div>
                    <button class="btn" id="refreshBtn">Refresh</button><button class="btn secondary" id="exportBtn">Export CSV</button>
                </div>
            </div>
            <div class="panel table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Registration</th>
                            <th>Family Code</th>
                            <th>Member</th>
                            <th>Phone</th>
                            <th>Guests</th>
                            <th>Dates</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        const API_BASE_URL = "https://YOUR-BACKEND-DOMAIN.example.com";
        let token = localStorage.getItem("asthiAdminToken") || "";
        let currentRows = [];

        const loginPanel = document.getElementById("loginPanel"),
            dashboard = document.getElementById("dashboard");

        function showDashboard() {
            loginPanel.classList.add("hidden");
            dashboard.classList.remove("hidden");
            loadRegistrations();
        }
        if (token) showDashboard();

        document.getElementById("loginForm").addEventListener("submit", async e => {
            e.preventDefault();
            const r = await fetch(API_BASE_URL + "/api/admin/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username.value,
                    password: password.value
                })
            });
            const d = await r.json();
            if (!r.ok) {
                loginError.textContent = d.message || "Login failed";
                return;
            }
            token = d.token;
            localStorage.setItem("asthiAdminToken", token);
            loginError.textContent = "";
            showDashboard();
        });
        logoutBtn.onclick = () => {
            token = "";
            localStorage.removeItem("asthiAdminToken");
            dashboard.classList.add("hidden");
            loginPanel.classList.remove("hidden");
        };
        refreshBtn.onclick = loadRegistrations;
        [search, status, date].forEach(x => x.addEventListener("input", loadRegistrations));
        exportBtn.onclick = async() => {
            const r = await fetch(API_BASE_URL + "/api/admin/export", {
                headers: {
                    Authorization: "Bearer " + token
                }
            });
            if (!r.ok) return alert("Export failed");
            const blob = await r.blob();
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "asthi-ahob-registrations.csv";
            a.click();
            URL.revokeObjectURL(a.href);
        };

        async function loadRegistrations() {
            const params = new URLSearchParams();
            if (search.value) params.set("search", search.value);
            if (status.value) params.set("status", status.value);
            if (date.value) params.set("date", date.value);
            const r = await fetch(API_BASE_URL + "/api/admin/registrations?" + params, {
                headers: {
                    Authorization: "Bearer " + token
                }
            });
            if (r.status === 401) {
                logoutBtn.click();
                return;
            }
            const d = await r.json();
            currentRows = d.registrations || [];
            total.textContent = d.stats.total;
            guests.textContent = d.stats.guests;
            confirmed.textContent = d.stats.confirmed;
            pending.textContent = d.stats.pending;
            rows.innerHTML = currentRows.map(x => `<tr><td>${esc(x.registrationId)}</td><td>${esc(x.familyCode)}</td><td>${esc(x.memberName)}</td><td>${esc(x.phoneNumber)}</td><td>${x.guestCount}</td><td>${dateFmt(x.checkIn)} - ${dateFmt(x.checkOut)}</td><td class="status">${esc(x.status)}</td><td><button class="btn" onclick="setStatus('${x.id}','Confirmed')">Confirm</button> <button class="btn secondary" onclick="setStatus('${x.id}','Cancelled')">Cancel</button></td></tr>`).join("");
        }
        async function setStatus(id, newStatus) {
            if (!confirm("Change status to " + newStatus + "?")) return;
            const r = await fetch(API_BASE_URL + "/api/admin/registrations/" + id, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: "Bearer " + token
                },
                body: JSON.stringify({
                    status: newStatus
                })
            });
            if (!r.ok) {
                alert("Update failed");
                return
            }
            loadRegistrations();
        }

        function dateFmt(v) {
            return new Date(v + "T00:00:00").toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short"
            });
        }

        function esc(v) {
            return String(v).replace(/[&<>"']/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[c]));
        }
    </script>
</body>

</html>
